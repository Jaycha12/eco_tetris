<script>
/* ===================== BASIC ===================== */
const ROW=20, COL=10, SIZE=30;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let board, piece, nextPiece, holdPiece=null;
let score=0, combo=0, best=+localStorage.getItem("best")||0;
let gameOver=false, holdUsed=false;
let waitingClear=false;

/* ===================== SPEED ===================== */
let dropTimer=0;
let dropBase=500;

/* DAS / ARR (핵심) */
let dasDir=0;       // -1 left, +1 right
let dasTime=0;
let arrTime=0;
let DAS_DELAY=140;
let ARR_RATE=35;

/* ===================== SHAPES ===================== */
const SHAPES=[
{type:'I', shape:[[1,1,1,1]], color:"cyan"},
{type:'O', shape:[[1,1],[1,1]], color:"yellow"},
{type:'T', shape:[[0,1,0],[1,1,1]], color:"purple"},
{type:'J', shape:[[1,0,0],[1,1,1]], color:"blue"},
{type:'L', shape:[[0,0,1],[1,1,1]], color:"orange"},
{type:'Z', shape:[[1,1,0],[0,1,1]], color:"red"},
{type:'S', shape:[[0,1,1],[1,1,0]], color:"lime"}
];

/* ===================== BAG ===================== */
let bag=[];
function refillBag(){
  bag=SHAPES.slice();
  for(let i=bag.length-1;i>0;i--){
    let j=(Math.random()*(i+1))|0;
    [bag[i],bag[j]]=[bag[j],bag[i]];
  }
}
function getNext(){
  if(!bag.length) refillBag();
  return bag.pop();
}

/* ===================== PIECE ===================== */
function clone(p){
  return {
    type:p.type,
    shape:p.shape.map(r=>[...r]),
    color:p.color,
    x:Math.floor(COL/2)-Math.floor(p.shape[0].length/2),
    y:0
  };
}

/* ===================== CRITICAL FIX ===================== */
/* 👉 canMove 버그 수정 (원래 코드는 piece 고정 참조였음) */
function canMove(px,py,shape,x,y){
  for(let r=0;r<shape.length;r++){
    for(let c=0;c<shape[r].length;c++){
      if(shape[r][c]){
        let nx=x+c+px;
        let ny=y+r+py;
        if(nx<0||nx>=COL||ny>=ROW) return false;
        if(ny>=0 && board[ny][nx]) return false;
      }
    }
  }
  return true;
}

/* ===================== SPAWN ===================== */
function spawn(){
  piece=clone(nextPiece);
  nextPiece=clone(getNext());
  if(!canMove(0,0,piece.shape,piece.x,piece.y)){
    gameOver=true;
    return;
  }
  holdUsed=false;
}

/* ===================== RESET ===================== */
function reset(){
  board=Array.from({length:ROW},()=>Array(COL).fill(null));
  score=0; combo=0;
  gameOver=false; holdPiece=null;
  refillBag();
  nextPiece=clone(getNext());
  spawn();
}

/* ===================== MOVE ===================== */
function move(dx,dy){
  if(canMove(dx,dy,piece.shape,piece.x,piece.y)){
    piece.x+=dx;
    piece.y+=dy;
    return true;
  }
  return false;
}

/* ===================== HARD DROP ===================== */
function hardDrop(){
  let d=0;
  while(move(0,1)) d++;
  score+=d*2;
  lock();
}

/* ===================== LOCK ===================== */
function lock(){
  for(let r=0;r<piece.shape.length;r++){
    for(let c=0;c<piece.shape[r].length;c++){
      if(piece.shape[r][c]){
        board[piece.y+r][piece.x+c]=piece.color;
      }
    }
  }
  clearLines();
  spawn();
}

/* ===================== CLEAR ===================== */
function clearLines(){
  let cleared=0;
  for(let r=ROW-1;r>=0;r--){
    if(board[r].every(v=>v)){
      board.splice(r,1);
      board.unshift(Array(COL).fill(null));
      cleared++;
      r++;
    }
  }
  if(cleared){
    score+=cleared*200;
    combo++;
  }else combo=0;
}

/* ===================== ROTATE (simple SRS-lite) ===================== */
function rotate(){
  let s=piece.shape;
  let ns=s[0].map((_,i)=>s.map(r=>r[i]).reverse());

  if(canMove(0,0,ns,piece.x,piece.y)){
    piece.shape=ns;
  }
}

/* ===================== HOLD ===================== */
function hold(){
  if(holdUsed) return;

  if(!holdPiece){
    holdPiece=clone(piece);
    spawn();
  }else{
    let t=clone(piece);
    piece=clone(holdPiece);
    holdPiece=t;
  }
  holdUsed=true;
}

/* ===================== DAS SYSTEM ===================== */
function dasUpdate(dt){
  if(dasDir===0) return;

  dasTime+=dt;

  if(dasTime>DAS_DELAY){
    arrTime+=dt;
    if(arrTime>ARR_RATE){
      move(dasDir,0);
      arrTime=0;
    }
  }
}

/* ===================== INPUT ===================== */
function bind(id,fn,dir=0){
  let el=document.getElementById(id);

  el.addEventListener("pointerdown",e=>{
    e.preventDefault();
    fn();

    if(dir!==0){
      dasDir=dir;
      dasTime=0;
      arrTime=0;
    }
  });

  el.addEventListener("pointerup",()=>{
    if(dir!==0) dasDir=0;
  });
}

bind("btnLeft",()=>move(-1,0),-1);
bind("btnRight",()=>move(1,0),1);
bind("btnRotate",rotate);
bind("btnDown",()=>move(0,1));
bind("btnDrop",hardDrop);
bind("btnHold",hold);
bind("btnReset",reset);
bind("btnRestart",reset);

/* ===================== LOOP ===================== */
let last=0;

function loop(t=0){
  if(!last) last=t;
  let dt=t-last;
  last=t;

  if(!gameOver){
    dasUpdate(dt);

    dropTimer+=dt;

    let speed = Math.max(60, dropBase - score*0.5);

    if(dropTimer>speed){
      if(!move(0,1)) lock();
      dropTimer=0;
    }
  }

  draw();
  requestAnimationFrame(loop);
}

/* ===================== DRAW ===================== */
function draw(){
  ctx.clearRect(0,0,300,600);

  for(let r=0;r<ROW;r++){
    for(let c=0;c<COL;c++){
      if(board[r][c]){
        ctx.fillStyle=board[r][c];
        ctx.fillRect(c*SIZE,r*SIZE,SIZE,SIZE);
      }
    }
  }

  if(piece){
    ctx.fillStyle=piece.color;
    for(let r=0;r<piece.shape.length;r++){
      for(let c=0;c<piece.shape[r].length;c++){
        if(piece.shape[r][c]){
          ctx.fillRect((piece.x+c)*SIZE,(piece.y+r)*SIZE,SIZE,SIZE);
        }
      }
    }
  }

  document.getElementById("score").innerText=score;
  document.getElementById("best").innerText="BEST "+best;
}

/* ===================== START ===================== */
reset();
requestAnimationFrame(loop);
</script>
