<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tetris Ultimate SRS</title>

<style>
body{
  margin:0; background:black; color:white;
  display:flex; justify-content:center; align-items:center; height:100vh;
  font-family:sans-serif; 
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  overflow: hidden;
}
#container{position:relative;display:flex;flex-direction:column;align-items:center;}
#game{width:420px;height:840px;border:2px solid #555; touch-action: none;}
#info{position:absolute;right:-220px;top:0;width:200px;display:flex;flex-direction:column;gap:10px;}
.panel{border:1px solid #555;padding:10px;text-align:center;background:#111;font-weight:bold;}
canvas.mini{background:black;margin-top:5px;display:block;margin-left:auto;margin-right:auto;}
#controls{margin-top:15px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:420px;}
button{
  padding:14px; font-size:16px; font-weight:bold;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  cursor: pointer;
  background:#222; color:white; border:1px solid #777; border-radius:4px;
}
button:active{background:#444;}
#gameOver{position:absolute;top:0;left:0;width:100%;height:100%;display:none;
justify-content:center;align-items:center;flex-direction:column;background:rgba(0,0,0,0.88);}
</style>
</head>

<body>

<div id="container">

<canvas id="game" width="300" height="600"></canvas>

<div id="info">
  <div class="panel" id="score">0</div>
  <div class="panel" id="best">BEST 0</div>
  <div class="panel" id="combo">COMBO 0</div>

  <div class="panel">NEXT
    <canvas id="nextCanvas" class="mini" width="80" height="80"></canvas>
  </div>

  <div class="panel">HOLD
    <canvas id="holdCanvas" class="mini" width="80" height="80"></canvas>
  </div>
</div>

<div id="controls">
  <button id="btnLeft">◀</button>
  <button id="btnRotate">↻</button>
  <button id="btnRight">▶</button>
  <button id="btnDown">▼</button>
  <button id="btnDrop">DROP</button>
  <button id="btnHold">HOLD</button>
  <button id="btnReset">RST</button>
</div>

<div id="gameOver">
  <div style="font-size:32px; margin-bottom:15px; color:#ff4444;">GAME OVER</div>
  <div id="final" style="margin-bottom:20px; font-size:18px;"></div>
  <button id="btnRestart" style="padding:12px 24px;">RESTART</button>
</div>

</div>

<script>
/* 확대 및 제스처 방지 */
document.addEventListener("gesturestart", e => e.preventDefault());

/* 사운드 (AudioContext) */
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function triggerAudioContext(){
  if(audioCtx.state === "suspended") audioCtx.resume();
}
document.body.addEventListener("pointerdown", triggerAudioContext, {once: true});

function beep(f, t=0.05){
  try {
    if(audioCtx.state !== "running") return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.frequency.value = f;
    g.gain.value = 0.15;
    o.start(); o.stop(audioCtx.currentTime + t);
  } catch(e) {}
}

/* 기본 환경 설정 */
const ROW=20, COL=10, SIZE=30;
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const nextCtx = document.getElementById("nextCanvas").getContext("2d");
const holdCtx = document.getElementById("holdCanvas").getContext("2d");

let board, piece, nextPiece, holdPiece = null;
let score = 0, combo = 0, b2b = false;
let best = Number(localStorage.getItem("best")) || 0;
let gameOver = false, holdUsed = false;

let clearRows = [], effectTimer = 0, waitingClear = false;

/* SHAPES */
const SHAPES=[
{type:'I', shape:[[1,1,1,1]], color:"cyan"},
{type:'O', shape:[[1,1],[1,1]], color:"yellow"},
{type:'T', shape:[[0,1,0],[1,1,1]], color:"purple"},
{type:'J', shape:[[1,0,0],[1,1,1]], color:"blue"},
{type:'L', shape:[[0,0,1],[1,1,1]], color:"orange"},
{type:'Z', shape:[[1,1,0],[0,1,1]], color:"red"},
{type:'S', shape:[[0,1,1],[1,1,0]], color:"lime"}
];

/* 7-bag 랜덤 시스템 */
let bag=[];
function refillBag(){
  bag = SHAPES.slice();
  for(let i = bag.length - 1; i > 0; i--){
    let j = Math.random() * (i + 1) | 0;
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
}
function getNext(){
  if(bag.length === 0) refillBag();
  return bag.pop();
}

/* 깊은 복사 */
function clonePiece(p){
  return {
    type: p.type,
    shape: p.shape.map(r => [...r]),
    color: p.color,
    x: Math.floor(COL / 2) - Math.floor(p.shape[0].length / 2),
    y: 0, 
    rot: 0
  };
}

function newPiece(){
  return clonePiece(getNext());
}

/* RESET */
function reset(){
  board = Array.from({length: ROW}, () => Array(COL).fill(null));
  score = 0; combo = 0; b2b = false;
  gameOver = false;
  waitingClear = false;
  effectTimer = 0;
  holdPiece = null;
  holdUsed = false;
  refillBag();
  nextPiece = newPiece();
  spawn();
  document.getElementById("gameOver").style.display = "none";
}

/* SPAWN */
function spawn(){
  piece = clonePiece(nextPiece);
  nextPiece = newPiece();

  if(!canMove(0, 0, piece.shape)){
    gameOver = true;
    beep(150, 0.3);
    if(score > best){
      best = score;
      localStorage.setItem("best", best);
    }
    showGameOver();
  }
  holdUsed = false;
}

/* MOVE & 충돌 판정 */
function canMove(dx, dy, s){
  for(let r = 0; r < s.length; r++){
    for(let c = 0; c < s[r].length; c++){
      if(s[r][c]){
        let nx = piece.x + c + dx;
        let ny = piece.y + r + dy;
        if(nx < 0 || nx >= COL || ny >= ROW) return false;
        if(ny >= 0 && board[ny] && board[ny][nx]) return false;
      }
    }
  }
  return true;
}

/* GHOST */
function getGhostY(){
  let y = piece.y;
  while(canMove(0, y - piece.y + 1, piece.shape)) y++;
  return y;
}

/* SRS 킥 데이터 */
const kicks = {
  normal:[
    [[0,0],[-1,0],[-1,1],[0,-2],[-1,-2]],
    [[0,0],[1,0],[1,-1],[0,2],[1,2]]
  ],
  I:[
    [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
    [[0,0],[2,0],[-1,0],[2,1],[-1,-2]]
  ]
};

/* 회전 시스템 */
let lastRotate = false;
function rotate(){
  if(gameOver || waitingClear) return;
  let old = piece.shape;
  let newShape = old[0].map((_, i) => old.map(r => r[i]).reverse());

  let testKicks = piece.type === 'I' ? kicks.I : kicks.normal;

  for(let i = 0; i < testKicks.length; i++){
    for(let [dx, dy] of testKicks[i]){
      if(canMove(dx, dy, newShape)){
        piece.shape = newShape;
        piece.x += dx;
        piece.y += dy;
        lastRotate = true;
        beep(440);
        return;
      }
    }
  }
  lastRotate = false;
}

/* T-SPIN 판정 */
function isTSpin(){
  if(piece.type !== 'T' || !lastRotate) return false;

  let cx = piece.x + 1;
  let cy = piece.y + 1;

  let corners = [
    [cx-1, cy-1], [cx+1, cy-1],
    [cx-1, cy+1], [cx+1, cy+1]
  ];

  let count = 0;
  corners.forEach(([x, y]) => {
    if(x < 0 || x >= COL || y >= ROW || (y >= 0 && board[y] && board[y][x])) count++;
  });

  return count >= 3;
}

/* LINE CLEAR */
function checkLines(){
  clearRows = [];
  for(let r = 0; r < ROW; r++){
    if(board[r].every(v => v !== null)) clearRows.push(r);
  }
  if(clearRows.length){
    effectTimer = 12;
    waitingClear = true;
    beep(600, 0.1);
  }
  return clearRows.length;
}

/* MERGE & 점수 시스템 */
function merge(){
  for(let r = 0; r < piece.shape.length; r++){
    for(let c = 0; c < piece.shape[r].length; c++){
      if(piece.shape[r][c]){
        let currentY = piece.y + r;
        if(currentY < 0){
          gameOver = true;
          showGameOver();
          return;
        }
        board[currentY][piece.x + c] = piece.color;
      }
    }
  }

  let tspin = isTSpin();
  let cleared = checkLines();

  if(cleared){
    combo++;
    let base = [0, 100, 300, 500, 800][cleared] || 800;

    if(tspin){
      base *= 2;
      if(b2b) base = Math.floor(base * 1.5);
      b2b = true;
    } else {
      if(cleared === 4){
        if(b2b) base = Math.floor(base * 1.5);
        b2b = true;
      } else {
        b2b = false;
      }
    }

    score += base + (combo - 1) * 50;
  } else {
    combo = 0;
    b2b = false;
  }

  lastRotate = false;

  if(!waitingClear){
    spawn();
  }
}

/* APPLY CLEAR */
function applyClear(){
  clearRows.sort((a, b) => a - b);
  clearRows.forEach(r => {
    board.splice(r, 1);
    board.unshift(Array(COL).fill(null));
  });
  waitingClear = false;
  spawn();
}

/* DRAW */
function draw(){
  ctx.clearRect(0, 0, 300, 600);

  // 선명한 격자 표시
  ctx.strokeStyle = "#3A3A3A";
  ctx.lineWidth = 1;
  for(let x = 0; x <= COL; x++){
    ctx.beginPath(); ctx.moveTo(x * SIZE, 0); ctx.lineTo(x * SIZE, 600); ctx.stroke();
  }
  for(let y = 0; y <= ROW; y++){
    ctx.beginPath(); ctx.moveTo(0, y * SIZE); ctx.lineTo(300, y * SIZE); ctx.stroke();
  }

  // Board 그리기
  for(let r = 0; r < ROW; r++){
    for(let c = 0; c < COL; c++){
      if(board[r][c]){
        ctx.fillStyle = board[r][c];
        ctx.fillRect(c * SIZE, r * SIZE, SIZE, SIZE);
        ctx.strokeStyle = "#111";
        ctx.strokeRect(c * SIZE, r * SIZE, SIZE, SIZE);
      }
    }
  }

  // 라인 삭제 시 흰색 깜빡 효과
  if(effectTimer > 0 && Math.floor(effectTimer / 2) % 2 === 0){
    ctx.fillStyle = "white";
    clearRows.forEach(r => {
      ctx.fillRect(0, r * SIZE, COL * SIZE, SIZE);
    });
  }

  // 고스트 표시
  if(!waitingClear && !gameOver && piece){
    let gy = getGhostY();
    ctx.globalAlpha = 0.3;
    ctx.fillStyle = piece.color;
    for(let r = 0; r < piece.shape.length; r++){
      for(let c = 0; c < piece.shape[r].length; c++){
        if(piece.shape[r][c]){
          ctx.fillRect((piece.x + c) * SIZE, (gy + r) * SIZE, SIZE, SIZE);
        }
      }
    }
    ctx.globalAlpha = 1;

    // 현재 조작 중인 피스
    ctx.fillStyle = piece.color;
    for(let r = 0; r < piece.shape.length; r++){
      for(let c = 0; c < piece.shape[r].length; c++){
        if(piece.shape[r][c]){
          ctx.fillRect((piece.x + c) * SIZE, (piece.y + r) * SIZE, SIZE, SIZE);
          ctx.strokeStyle = "#000";
          ctx.strokeRect((piece.x + c) * SIZE, (piece.y + r) * SIZE, SIZE, SIZE);
        }
      }
    }
  }

  document.getElementById("score").innerText = score;
  document.getElementById("best").innerText = "BEST " + best;
  document.getElementById("combo").innerText = "COMBO " + combo;

  drawMini(nextCtx, nextPiece);
  drawMini(holdCtx, holdPiece);
}

function drawMini(targetCtx, p){
  targetCtx.clearRect(0, 0, 80, 80);
  if(!p) return;
  
  let size = 16;
  let rows = p.shape.length;
  let cols = p.shape[0].length;
  
  let offsetX = (80 - cols * size) / 2;
  let offsetY = (80 - rows * size) / 2;

  targetCtx.fillStyle = p.color;
  for(let r = 0; r < rows; r++){
    for(let c = 0; c < cols; c++){
      if(p.shape[r][c]){
        targetCtx.fillRect(offsetX + c * size, offsetY + r * size, size - 1, size - 1);
      }
    }
  }
}

/* UI / GAME OVER */
function showGameOver(){
  document.getElementById("gameOver").style.display = "flex";
  document.getElementById("final").innerText = "Score: " + score + " / Best: " + best;
}

/* CONTROLS */
function moveLeft(){ 
  if(gameOver || waitingClear || !piece) return; 
  if(canMove(-1, 0, piece.shape)){ piece.x--; beep(300); } 
}
function moveRight(){ 
  if(gameOver || waitingClear || !piece) return; 
  if(canMove(1, 0, piece.shape)){ piece.x++; beep(300); } 
}
function moveDown(){ 
  if(gameOver || waitingClear || !piece) return; 
  if(canMove(0, 1, piece.shape)){ 
    piece.y++; 
    score += 1; 
  } else { 
    merge(); 
  } 
}
function hardDrop(){
  if(gameOver || waitingClear || !piece) return;
  let d = 0;
  while(canMove(0, 1, piece.shape)){ 
    piece.y++; 
    d++; 
  }
  score += d * 2; 
  beep(500, 0.08);
  merge();
}
function hold(){
  if(gameOver || waitingClear || holdUsed || !piece) return;
  beep(350);

  if(!holdPiece){
    holdPiece = clonePiece(piece);
    spawn();
  } else {
    let temp = clonePiece(piece);
    piece = clonePiece(holdPiece);
    holdPiece = clonePiece(temp);
    piece.x = Math.floor(COL / 2) - Math.floor(piece.shape[0].length / 2);
    piece.y = 0;
  }
  holdUsed = true;
}

/* 터치 버튼 바인딩 */
function bindTouch(id, action){
  const el = document.getElementById(id);
  el.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    action();
  });
}

bindTouch("btnLeft", moveLeft);
bindTouch("btnRotate", rotate);
bindTouch("btnRight", moveRight);
bindTouch("btnDown", moveDown);
bindTouch("btnDrop", hardDrop);
bindTouch("btnHold", hold);
bindTouch("btnReset", reset);
bindTouch("btnRestart", reset);

/* GAME LOOP (last 초기화 버그 방지 반영) */
let last = 0, t = 0;
function loop(time = 0){
  if(last === 0) last = time; // 🔥 첫 프레임 델타 타임 튐 현상 방지

  if(!gameOver){
    if(waitingClear){
      effectTimer--;
      if(effectTimer <= 0) applyClear();
    } else {
      let d = time - last; 
      last = time; 
      t += d;
      
      let dropInterval = Math.max(120, 500 - Math.floor(score / 800) * 35);

      if(t > dropInterval){ 
        if(piece && canMove(0, 1, piece.shape)){
          piece.y++;
        } else if(piece) {
          merge();
        }
        t = 0; 
      }
    }
  }
  draw();
  requestAnimationFrame(loop);
}

// 🔥 초기화 후 루프 시작 순서 엄수
reset();
loop();
</script>

</body>
</html>
